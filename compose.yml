---
services:
  db:
    image: shaikmustafa/arshad:db
    deploy:
      replicas: 1
    ports:
      - "3307:3306"
    networks:
      - mynetwork

  auth_service:
    image: shaikmustafa/arshad:auth
    deploy:
      replicas: 1
    ports:
      - "5011:5001"
    networks:
      - mynetwork
    depends_on:
      - db
    

  book_service:
    image: shaikmustafa/arshad:book
    deploy:
      replicas: 1
    ports:
      - "5030:5002"
    networks:
      - mynetwork
    depends_on:
      - db
  borrow_service:
    image: shaikmustafa/arshad:borrow
    deploy:
      replicas: 1
    ports:
      - "5020:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: shaikmustafa/arshad:frontend
    deploy:
      replicas: 1
    ports:
      - "5010:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: bridge
